<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login - OCR Monitoring</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-heading">
                <h1>OCR Monitoring</h1>
                <p>Sign in to continue</p>
            </div>

            {% if error_message %}
                <div
                    class="login-message"
                    role="alert"
                >
                    {{ error_message }}
                </div>
            {% endif %}

            <form
                method="post"
                action="{{ url_for('login') }}"
                class="login-form"
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <input
                    type="hidden"
                    name="next"
                    value="{{ next_path }}"
                >

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </main>

</body>
</html>
